<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThunderCode - Résultats des Tests</title>
</head>
<body>
    <div class="container">
        <h1>ThunderCode - Analyse des Résultats des Tests</h1>
        
        <div class="form-group">
            <label for="testName">Nom du test</label>
            <input type="text" id="testName" placeholder="Ex : Test de connexion">
        </div>
        
        <div class="form-group">
            <label for="testType">Type de test</label>
            <select id="testType">
                <option value="Unit">Unitaire</option>
                <option value="Integration">Intégration</option>
                <option value="Performance">Performance</option>
            </select>
        </div>

        <div class="form-group">
            <label for="testStatus">Statut</label>
            <select id="testStatus">
                <option value="success">Réussi</option>
                <option value="failure">Échoué</option>
                <option value="pending">En attente</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="testDuration">Temps d'exécution simulé (secondes)</label>
            <input type="number" id="testDuration" placeholder="Ex : 2.5" min="0" step="1">
        </div>
        
        <button onclick="addTestResult()">Lance le Test AI</button>
        
        <div id="result" class="result-box success" style="display: block;">
            <div id="resultTitle" style="font-weight: bold; font-size: 18px;">Analyse Terminée</div>
            <div class="score" id="successRate">100%</div>
            <div id="resultLevel" style="font-weight: 600;">Tous les tests sont réussis !</div>
            <div class="summary">
                <span>Total: <strong id="totalTests">0</strong></span>
                <span>Réussis: <strong id="passedTests">0</strong></span>
                <span>Échoués: <strong id="failedTests">0</strong></span>
            </div>
            <ul class="details" id="testDetails"></ul>
        </div>
    </div>

    <script>
        let tests = [];

        function addTestResult() {
            const name = document.getElementById('testName').value.trim();
            const type = document.getElementById('testType').value;
            const status = document.getElementById('testStatus').value;
            const duration = parseFloat(
                document.getElementById('testDuration').value
            );

            if (name === '' || document.getElementById('testDuration').value === '' 
                || !Number.isFinite(duration) || duration < 0) {
                alert('Veuillez saisir un nom et une durée valide.');
                return;
            }

            const test = {
                name: name,
                type: type,
                status: status,
                duration: duration
            };

            tests.push(test);

            displayResults();

            document.getElementById('testName').value = '';
            document.getElementById('testDuration').value = '';
        }

        function displayResults() {
            const total = tests.length;

            const passed = tests.filter(
                test => test.status === 'success'
            ).length;

            const failed = tests.filter(
                test => test.status === 'failure'
            ).length;

            const pending = tests.filter(
                test => test.status === 'pending'
            ).length;

            const successRate = total > 0 
                ? Math.round((passed / total) * 100) 
                : 0;

            const resultDiv = document.getElementById('result');

            resultDiv.style.display = 'block';

            document.getElementById('successRate').innerText = 
                successRate + '%';

            document.getElementById('totalTests').innerText = total;
            document.getElementById('passedTests').innerText = passed;
            document.getElementById('failedTests').innerText = failed;

            const level = document.getElementById('resultLevel');

            resultDiv.className = 'result-box';

            if (failed > 0) {
                resultDiv.classList.add('danger');
                level.innerText = 'Des tests ont échoué.';
            } else if (pending > 0) {
                resultDiv.classList.add('warning');
                level.innerText = 'Des tests sont encore en attente.';
            } else {
                resultDiv.classList.add('success');
                level.innerText = 'Tous les tests sont réussis !';
            }

            const details = document.getElementById('testDetails');

            details.innerHTML = '';

            tests.forEach((test, index) => {
                const li = document.createElement('li');

                let statusText = '';

                if (test.status === 'success') {
                    statusText = 'Réussi';
                } else if (test.status === 'failure') {
                    statusText = 'Échoué';
                } else {
                    statusText = 'En attente';
                }

                li.innerText = 
                    `Test ${index + 1} : ${test.name} | ` +
                    `Type : ${test.type} | ` +
                    `Résultat : ${statusText} | ` +
                    `Durée : ${test.duration} secondes`;

                details.appendChild(li);
            });
        }
    </script>
</body>
</html>
